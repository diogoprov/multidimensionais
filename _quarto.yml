project:
  type: website
  output-dir: docs
  resources:
    # PDFs das versões anteriores: continuam publicados para não quebrar
    # links antigos depois que as aulas passarem para revealjs.
    - "slides/*.pdf"
  render:
    - "*.qmd"
    - "aula-*/*.qmd"
    - "slides/*.qmd"
    - "!README.md"
    - "!CLAUDE.md"
    - "!PLANO-conversao-qmd.md"

website:
  title: "Análises Multidimensionais"
  description: "Disciplina de pós-graduação em Biologia Animal (UFMS) — classificação, ordenação e análises canônicas em R."
  site-url: "https://provetelab.org/multidimensionais/"
  favicon: favicon.png
  open-graph: true

  repo-url: "https://github.com/diogoprov/multidimensionais"

  navbar:
    background: light
    pinned: true
    collapse-below: lg
    title: "Análises Multidimensionais"
    left:
      - href: index.qmd
        text: Início
      - href: comece-aqui.qmd
        text: Comece aqui
      - href: programa.qmd
        text: Programa
      - text: Estudar
        menu:
          - href: praticas.qmd
            text: Roteiros práticos
          - href: glossario.qmd
            text: Glossário
    right:
      - icon: github
        href: "https://github.com/diogoprov/multidimensionais"
        aria-label: GitHub
      - icon: house-door
        href: "https://provetelab.org/"
        aria-label: Biodiversity Synthesis Lab

  page-footer:
    background: light
    left: |
      © Diogo B. Provete · Biodiversity Synthesis Lab · Instituto de Biociências, UFMS
    center: |
      Conteúdo sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.pt-br), exceto onde indicado
    right: |
      Built with [Quarto](https://quarto.org).

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

knitr:
  opts_chunk:
    dev.args:
      bg: "#faf7f0"

# Os slides têm chunks de R que geram as figuras. Com freeze, o resultado
# fica em _freeze/ (versionado) e o CI renderiza só com o Quarto, sem os
# pacotes de ecologia numérica. Depois de mudar um .qmd com código ou uma
# função em R/, rode `quarto render` localmente e commite _freeze/ junto.
lang: pt
execute:
  freeze: auto
  warning: false
  message: false

editor: source
